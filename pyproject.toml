[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afa-pipeline-core"
version = "0.1.1"
description = "Core modules of the Android Forensic Analysis Pipeline: read-only ingestion, EXIF anomaly analysis, plugin registry and a hash-chained audit log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dorirri" }]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=11.1,<13",
]
keywords = ["digital-forensics", "exif", "android", "provenance", "audit-log"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "build==1.6.1",
    "piexif==1.1.3",
    "afa-pipeline-core[integrity,ocr]",
]
# Synthetic demo-image generator (scripts/image_generator.py).
demo = [
    "piexif==1.1.3",
]
# ELA + JPEG ghost analyzer ported from the prototype.
integrity = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
]
# Tesseract OCR analyzer ported from the prototype (needs the tesseract program).
ocr = [
    "pytesseract>=0.3.10,<0.4",
    "opencv-python-headless>=4.8,<5",
    "numpy>=1.26,<3",
]

[project.scripts]
afa = "afa_pipeline.cli:main"

[project.urls]
Repository = "https://github.com/dorirri/afa-pipeline-core"
Issues = "https://github.com/dorirri/afa-pipeline-core/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afa_pipeline = ["py.typed"]

# --- Tooling ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["afa_pipeline"]
branch = true
# Ported prototype code is kept verbatim, including its own report writer and CLI that
# the pipeline does not call. It is exercised through the typed adapters and their tests.
omit = ["*/afa_pipeline/analyzers/legacy/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "D",       # pydocstyle (public API docstrings)
    "S",       # bandit-style security checks
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]
# Synthetic test-data generator: `random` is used for fake data, not for security.
"scripts/image_generator.py" = ["S311"]
# Code ported from the original prototype is kept as close to the original as possible.
"src/afa_pipeline/analyzers/legacy/*" = ["D", "E501", "B006"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Ported prototype code is untyped; its typed adapters are checked strictly.
module = ["afa_pipeline.analyzers.legacy.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "pytesseract.*", "cv2.*"]
ignore_missing_imports = true
